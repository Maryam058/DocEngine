site_name: DocEngine
site_description: AI-assisted technical documentation
site_author: Maryam Rehman
site_url: https://maryam058.github.io/DocEngine/

docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md

  - User Guide:
      - Quick Start: UserGuide/quickstart.md
      - Register a Patient: UserGuide/Register a patient.md
      - Book an Appointment: UserGuide/book-appointment.md
      - Manage Appointments: UserGuide/manage-appointments.md
      - Covid CCM: UserGuide/Covid-CCM.md
      - Health Kiosk Integration: UserGuide/Health-Kiosk-Integration.md

      - Medical Warnings: UserGuide/Medical_Warnings.md
  - API Reference:
      - OpenAPI: api/api-reference.md

  - Release Notes:
      - Latest Release Notes: release-notes/latest-release-notes.md
      - Sprint v2.3.4.7 (Feb 2026): release-notes/Release Notes_Sprint v2.3.4.7-feb26.md

  - Glossary: glossary.md

  - Style Guide: style-guide.md

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes

plugins:
  - search

extra_css:
  - stylesheets/extra.css
  - stylesheets/doc-authoring.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/sweetalert2@11
  - javascripts/doc-authoring.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

copyright: © 2026 DocEngine