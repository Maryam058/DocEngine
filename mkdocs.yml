site_name: DocEngine
site_description: AI-assisted technical documentation
site_author: Maryam Rehman
site_url: https://maryam058.github.io/DocEngine/

docs_dir: docs
site_dir: site
use_directory_urls: true

nav:
  - Home: index.md

  - User Guide:
      - Quick Start: UserGuide/quickstart.md
      - Book an Appointment: UserGuide/book-appointment.md
      - Manage Appointments: UserGuide/manage-appointments.md
      - Covid CCM: UserGuide/Covid-CCM.md
      - Health Kiosk Integration: UserGuide/Health-Kiosk-Integration.md
      - Medical Warnings: UserGuide/Medical_Warnings.md

  - Release Notes:
      - Overview: release-notes/Overview.md
      - Sprint v2.3.4.7 (Feb 2026): release-notes/Release Notes_Sprint v2.3.4.7-feb26.md
      - AI Copilot Release Notes: release-notes/AI Copilot.md

  - Glossary: glossary.md

  - Style Guide: style-guide.md

theme:
  name: material
  custom_dir: overrides

  logo: assets/logo.png
  favicon: assets/logo.png

  font:
    text: Inter
    code: Roboto Mono

  palette:
      scheme: default

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search

extra_css:
  - https://cdn.quilljs.com/1.3.6/quill.snow.css
  - stylesheets/extra.css
  - stylesheets/theme-polish.css
  - stylesheets/doc-authoring.css
  - stylesheets/page-chrome.css
  - stylesheets/image-editing.css


extra_javascript:
  - https://cdn.jsdelivr.net/npm/sweetalert2@11
  - https://cdn.quilljs.com/1.3.6/quill.min.js
  - javascripts/doc-authoring.js
  - javascripts/page-chrome.js
  - javascripts/image-editing.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

copyright: © 2026 DocEngine