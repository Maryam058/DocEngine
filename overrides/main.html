{% extends "base.html" %}

{% block extrahead %}

  {{ super() }}

  {% if page.title is defined and page.url != "" and page.url != "index/" %}

  <script>
    window.DOCENGINE_SITE_AUTHOR = {{ config.site_author | tojson }};
    window.DOCENGINE_PAGE_TITLE = {{ page.title | tojson }};
  </script>

  {% endif %}

{% endblock %}

{% block content %}

  {% if page.url != "" and page.url != "index/" %}

  <div class="doc-actions">
      <button class="edit-btn" onclick="openEditor()">
          ✏️ Edit Page
      </button>
  </div>

  {% endif %}

  {{ super() }}

{% endblock %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
